name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: node --check server.mjs && node --check mcp.mjs && node --check cli.mjs

      - name: MCP protocol regression
        run: node verify-mcp.mjs

  # 推送 v* tag 时自动发布到 npm（需在仓库 Secrets 配置 NPM_TOKEN）
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance（npmjs 展示构建来源）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Tag must match package.json version
        run: node -e "const v=require('./package.json').version;if('v'+v!==process.env.GITHUB_REF_NAME){console.error('tag '+process.env.GITHUB_REF_NAME+' != package.json v'+v);process.exit(1)}"

      - name: Pack preview
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
